<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- cream app-icon background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#FBF6EC"/>

  <g transform="translate(256 256) scale(1.22) rotate(-20) translate(-256 -256)" stroke="#1A1A1A" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <!-- handle -->
    <rect x="150" y="240" width="212" height="32" rx="10" fill="#FFFFFF"/>
    <!-- end caps -->
    <rect x="92" y="236" width="24" height="40" rx="8" fill="#FFFFFF"/>
    <rect x="396" y="236" width="24" height="40" rx="8" fill="#FFFFFF"/>
    <!-- outer plates (pastel blue) -->
    <rect x="112" y="196" width="42" height="120" rx="16" fill="#C4DDF6"/>
    <rect x="358" y="196" width="42" height="120" rx="16" fill="#C4DDF6"/>
    <!-- inner plates (mint) -->
    <rect x="150" y="174" width="46" height="164" rx="18" fill="#BDE8D5"/>
    <rect x="316" y="174" width="46" height="164" rx="18" fill="#BDE8D5"/>
  </g>
</svg>
